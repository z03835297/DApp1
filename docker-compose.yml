# token1-dapp — production-style run
#
# 推荐：./scripts/run-docker.sh（使用 .env.local；缺省时从 .env.local.example 生成）
#
# 手动：docker compose --env-file .env.local build && docker compose --env-file .env.local up -d
# Logs: docker compose --env-file .env.local logs -f
#
# 构建参数里的 ${NEXT_PUBLIC_* } 来自 compose 变量（通过 --env-file .env.local）。
# 容器内运行时变量由 env_file 注入（COMPOSE_ENV_FILE 默认为 .env.local，脚本会导出）。
#
# 本地有 contracts.json 时会打进镜像；没有则用 contracts.example.json（见 Dockerfile）。
#
# Proxmox LXC 等嵌套环境若启动失败（如 ip_unprivileged_port_start permission denied），保留下方
# privileged；在普通 KVM/裸机上为更安全可改为 false 或删掉该行。

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    env_file:
      - ${COMPOSE_ENV_FILE:-.env.local}
    network_mode: host
    environment:
      NODE_ENV: production
    restart: always

